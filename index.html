<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오 · T03</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --ink: #f1f3f7;
      --muted: #9ca3af;
      --line: #2e3344;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 0;
    }
    .preview-area {
      display: flex;
      flex-direction: column;
      background: #0a0c12;
      border-right: 1px solid var(--line);
      min-width: 0;
      min-height: 0;
    }
    .preview-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .preview-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .preview-header span {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    .canvas-frame {
      background: #111;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      flex-shrink: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .placeholder {
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .placeholder strong {
      display: block;
      color: var(--ink);
      margin-bottom: 6px;
      font-size: 1rem;
    }
    .controls {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      height: 100%;
      overflow: hidden;
    }
    .controls-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .section {
      background: var(--surface2);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--ink);
    }
    label span {
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="range"] {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--line);
      border-radius: 99px;
      outline: none;
      margin-bottom: 8px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    input[type="color"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
      padding: 3px;
    }
    .color-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ratio-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .ratio-btn {
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }
    .ratio-btn:hover { border-color: var(--accent); color: var(--ink); }
    .ratio-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .file-btn { 
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .file-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: .15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      width: 100%;
    }
    .btn-ghost:hover {
      background: var(--surface2);
      color: var(--ink);
    }
    .btn-download {
      background: #059669;
      color: #fff;
      width: 100%;
    }
    .btn-download:hover { background: #10b981; }
    .btn-download:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }
    .msg {
      font-size: 0.78rem;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }
    .msg.error {
      background: rgba(248,113,113,.12);
      color: var(--danger);
      border: 1px solid rgba(248,113,113,.25);
      display: block;
    }
    .msg.ok {
      background: rgba(52,211,153,.12);
      color: var(--success);
      border: 1px solid rgba(52,211,153,.25);
      display: block;
    }
    .footer-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media (max-width: 700px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .controls { max-height: 48vh; }
      .preview-area { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="preview-area">
      <div class="preview-header">
        <h1>짤·카드 스튜디오</h1>
        <span>T03 · 2단계</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="placeholder" id="placeholder">
          <strong>이미지를 올려주세요</strong>
          PNG 또는 JPEG 파일을 선택하면<br>여기에 미리보기가 나타납니다
        </div>
        <div class="canvas-frame" id="canvasFrame" style="display:none;">
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="section">
        <div class="controls-body">
          <div class="file-btn">
            <button class="btn btn-primary" type="button">이미지 선택</button>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,.png,.jpg,.jpeg">
          </div>
          <div class="msg" id="msg"></div>

          <div class="section-title">화면비</div>
          <div class="ratio-btns">
            <button class="ratio-btn active" data-ratio="1/1">1:1</button>
            <button class="ratio-btn" data-ratio="4/5">4:5</button>
            <button class="ratio-btn" data-ratio="9/16">9:16</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">문구</div>
          <input type="text" id="textInput" placeholder="문구를 입력하세요" value="오늘의 한 줄">
        </div>

        <div class="section">
          <div class="section-title">위치</div>
          <label for="posX">X <span id="posXVal">50</span></label>
          <input type="range" id="posX" min="0" max="800" value="50">
          <label for="posY">Y <span id="posYVal">50</span></label>
          <input type="range" id="posY" min="0" max="800" value="50">
        </div>

        <div class="section">
          <div class="section-title">크기</div>
          <label for="fontSize">글자 크기 <span id="fontSizeVal">48</span>px</label>
          <input type="range" id="fontSize" min="12" max="120" value="48">
        </div>

        <div class="section">
          <div class="section-title">색상</div>
          <div class="color-row">
            <div>
              <label for="textColor">글자</label>
              <input type="color" id="textColor" value="#ffffff">
            </div>
            <div>
              <label for="strokeColor">외곽선</label>
              <input type="color" id="strokeColor" value="#000000">
            </div>
          </div>
          <label for="strokeWidth" style="margin-top:8px">외곽선 두께 <span id="strokeWidthVal">0</span></label>
          <input type="range" id="strokeWidth" min="0" max="12" value="0">
        </div>
      </div>

      <div class="footer-actions">
        <button class="btn btn-download" type="button" id="downloadBtn" disabled>이미지 다운로드</button>
        <button class="btn btn-ghost" type="button" id="resetBtn">문구 초기화</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const placeholder = document.getElementById('placeholder');
    const canvasFrame = document.getElementById('canvasFrame');
    const msgEl = document.getElementById('msg');
    const textInput = document.getElementById('textInput');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const posXVal = document.getElementById('posXVal');
    const posYVal = document.getElementById('posYVal');
    const fontSize = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const textColor = document.getElementById('textColor');
    const strokeColor = document.getElementById('strokeColor');
    const strokeWidth = document.getElementById('strokeWidth');
    const strokeWidthVal = document.getElementById('strokeWidthVal');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const ratioBtns = document.querySelectorAll('.ratio-btn');

    let currentImage = null;
    let currentRatio = '1/1'; // 기본값

    // 화면비별 출력 크기 (실제 다운로드 해상도)
    const RATIO_SIZE = {
      '1/1':  { w: 1080, h: 1080 },
      '4/5':  { w: 1080, h: 1350 },
      '9/16': { w: 1080, h: 1920 }
    };

    function showMsg(text, type = 'error') {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
    }
    function clearMsg() {
      msgEl.className = 'msg';
      msgEl.textContent = '';
    }

    function getOutputSize() {
      return RATIO_SIZE[currentRatio];
    }

    // 이미지를 선택한 비율에 맞게 cover 방식으로 그리기
    function drawImageCover(img, targetW, targetH) {
      const imgRatio = img.width / img.height;
      const targetRatio = targetW / targetH;
      let sx, sy, sw, sh;

      if (imgRatio > targetRatio) {
        // 이미지가 더 넓음 → 좌우 자름
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        // 이미지가 더 높음 → 상하 자름
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
    }

    function draw() {
      if (!currentImage) return;

      const { w, h } = getOutputSize();
      canvas.width = w;
      canvas.height = h;

      canvasFrame.style.aspectRatio = `${w} / ${h}`;

      ctx.clearRect(0, 0, w, h);
      drawImageCover(currentImage, w, h);

      const text = textInput.value || '';
      const size = Number(fontSize.value);
      const x = Number(posX.value);
      const y = Number(posY.value);
      const color = textColor.value;
      const sColor = strokeColor.value;
      const sWidth = Number(strokeWidth.value);

      ctx.font = `bold ${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      if (sWidth > 0) {
        ctx.lineWidth = sWidth;
        ctx.strokeStyle = sColor;
        ctx.strokeText(text, x, y);
      }
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);

      // 슬라이더 최대값 업데이트
      posX.max = w;
      posY.max = h;
    }

    // 화면비 버튼
    ratioBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        ratioBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.dataset.ratio;
        draw();
      });
    });

    // 파일 업로드
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const validTypes = ['image/png', 'image/jpeg'];
      const validExt = /\.(png|jpe?g)$/i.test(file.name);

      if (!validTypes.includes(file.type) && !validExt) {
        showMsg('PNG 또는 JPEG만 가능합니다. 기존 작업은 유지됩니다.');
        fileInput.value = '';
        return;
      }

      clearMsg();
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          placeholder.style.display = 'none';
          canvasFrame.style.display = 'flex';
          downloadBtn.disabled = false;

          const { w, h } = getOutputSize();
          posX.value = Math.round(w * 0.08);
          posY.value = Math.round(h * 0.08);
          posXVal.textContent = posX.value;
          posYVal.textContent = posY.value;

          draw();
          showMsg('이미지를 불러왔습니다', 'ok');
        };
        img.onerror = () => showMsg('이미지를 불러오지 못했습니다.');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 실시간 반영
    [textInput, posX, posY, fontSize, textColor, strokeColor, strokeWidth].forEach(el => {
      el.addEventListener('input', () => {
        if (el === posX) posXVal.textContent = el.value;
        if (el === posY) posYVal.textContent = el.value;
        if (el === fontSize) fontSizeVal.textContent = el.value;
        if (el === strokeWidth) strokeWidthVal.textContent = el.value;
        draw();
      });
    });

    // 다운로드
    downloadBtn.addEventListener('click', () => {
      if (!currentImage) return;
      const link = document.createElement('a');
      const ratioName = currentRatio.replace('/', '-');
      link.download = `meme-${ratioName}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 초기화
    resetBtn.addEventListener('click', () => {
      textInput.value = '오늘의 한 줄';
      const { w, h } = getOutputSize();
      posX.value = Math.round(w * 0.08);
      posY.value = Math.round(h * 0.08);
      posXVal.textContent = posX.value;
      posYVal.textContent = posY.value;
      fontSize.value = 48;
      fontSizeVal.textContent = '48';
      textColor.value = '#ffffff';
      strokeColor.value = '#000000';
      strokeWidth.value = 0;
      strokeWidthVal.textContent = '0';
      draw();
    });
  </script>
</body>
</html>
