<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오 · T03</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --ink: #f1f3f7;
      --muted: #9ca3af;
      --line: #2e3344;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
    }
    /* 왼쪽: 미리보기 */
    .preview-area {
      display: flex;
      flex-direction: column;
      background: #0a0c12;
      border-right: 1px solid var(--line);
    }
    .preview-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .preview-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .preview-header span {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .placeholder {
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .placeholder strong {
      display: block;
      color: var(--ink);
      margin-bottom: 6px;
      font-size: 1rem;
    }
    /* 오른쪽: 컨트롤 */
    .controls {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      height: 100%;
      overflow: hidden;
    }
    .controls-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section {
      background: var(--surface2);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--ink);
    }
    label span {
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="range"] {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--line);
      border-radius: 99px;
      outline: none;
      margin-bottom: 8px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    input[type="color"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
      padding: 3px;
    }
    .color-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .file-btn {
      position: relative;
      overflow: hidden;
    }
    .file-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: .15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      width: 100%;
    }
    .btn-ghost:hover {
      background: var(--surface2);
      color: var(--ink);
    }
    .msg {
      font-size: 0.78rem;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }
    .msg.error {
      background: rgba(248,113,113,.12);
      color: var(--danger);
      border: 1px solid rgba(248,113,113,.25);
      display: block;
    }
    .msg.ok {
      background: rgba(52,211,153,.12);
      color: var(--success);
      border: 1px solid rgba(52,211,153,.25);
      display: block;
    }
    .footer-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media (max-width: 700px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .controls { max-height: 48vh; }
      .preview-area { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 미리보기 -->
    <div class="preview-area">
      <div class="preview-header">
        <h1>짤·카드 스튜디오</h1>
        <span>T03 · 1단계</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="placeholder" id="placeholder">
          <strong>이미지를 올려주세요</strong>
          PNG 또는 JPEG 파일을 선택하면<br>여기에 미리보기가 나타납니다
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
    </div>

    <!-- 컨트롤 -->
    <div class="controls">
      <div class="controls-body">
        <div class="file-btn">
          <button class="btn btn-primary" type="button">이미지 선택</button>
          <input type="file" id="fileInput" accept="image/png,image/jpeg,.png,.jpg,.jpeg">
        </div>
        <div class="msg" id="msg"></div>

        <div class="section">
          <div class="section-title">문구</div>
          <input type="text" id="textInput" placeholder="문구를 입력하세요" value="오늘의 한 줄">
        </div>

        <div class="section">
          <div class="section-title">위치</div>
          <label for="posX">X <span id="posXVal">50</span></label>
          <input type="range" id="posX" min="0" max="800" value="50">
          <label for="posY">Y <span id="posYVal">50</span></label>
          <input type="range" id="posY" min="0" max="800" value="50">
        </div>

        <div class="section">
          <div class="section-title">크기</div>
          <label for="fontSize">글자 크기 <span id="fontSizeVal">48</span>px</label>
          <input type="range" id="fontSize" min="12" max="120" value="48">
        </div>

        <div class="section">
          <div class="section-title">색상</div>
          <div class="color-row">
            <div>
              <label for="textColor">글자</label>
              <input type="color" id="textColor" value="#ffffff">
            </div>
            <div>
              <label for="strokeColor">외곽선</label>
              <input type="color" id="strokeColor" value="#000000">
            </div>
          </div>
          <label for="strokeWidth" style="margin-top:8px">외곽선 두께 <span id="strokeWidthVal">0</span></label>
          <input type="range" id="strokeWidth" min="0" max="12" value="0">
        </div>
      </div>

      <div class="footer-actions">
        <button class="btn btn-ghost" type="button" id="resetBtn">문구 초기화</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const placeholder = document.getElementById('placeholder');
    const msgEl = document.getElementById('msg');
    const textInput = document.getElementById('textInput');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const posXVal = document.getElementById('posXVal');
    const posYVal = document.getElementById('posYVal');
    const fontSize = document.getElementById('fontSize');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const textColor = document.getElementById('textColor');
    const strokeColor = document.getElementById('strokeColor');
    const strokeWidth = document.getElementById('strokeWidth');
    const strokeWidthVal = document.getElementById('strokeWidthVal');
    const resetBtn = document.getElementById('resetBtn');

    let currentImage = null;

    function showMsg(text, type = 'error') {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
    }
    function clearMsg() {
      msgEl.className = 'msg';
      msgEl.textContent = '';
    }

    function updateSliderMax() {
      if (!currentImage) return;
      posX.max = currentImage.width;
      posY.max = currentImage.height;
    }

    function draw() {
      if (!currentImage) return;
      canvas.width = currentImage.width;
      canvas.height = currentImage.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0);

      const text = textInput.value || '';
      const size = Number(fontSize.value);
      const x = Number(posX.value);
      const y = Number(posY.value);
      const color = textColor.value;
      const sColor = strokeColor.value;
      const sWidth = Number(strokeWidth.value);

      ctx.font = `bold ${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      if (sWidth > 0) {
        ctx.lineWidth = sWidth;
        ctx.strokeStyle = sColor;
        ctx.strokeText(text, x, y);
      }
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const validTypes = ['image/png', 'image/jpeg'];
      const validExt = /\.(png|jpe?g)$/i.test(file.name);

      if (!validTypes.includes(file.type) && !validExt) {
        showMsg('PNG 또는 JPEG만 가능합니다. 기존 작업은 유지됩니다.');
        fileInput.value = '';
        return;
      }

      clearMsg();
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          updateSliderMax();
          posX.value = Math.round(img.width * 0.08);
          posY.value = Math.round(img.height * 0.08);
          posXVal.textContent = posX.value;
          posYVal.textContent = posY.value;
          draw();
          showMsg('이미지를 불러왔습니다', 'ok');
        };
        img.onerror = () => showMsg('이미지를 불러오지 못했습니다.');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    [textInput, posX, posY, fontSize, textColor, strokeColor, strokeWidth].forEach(el => {
      el.addEventListener('input', () => {
        if (el === posX) posXVal.textContent = el.value;
        if (el === posY) posYVal.textContent = el.value;
        if (el === fontSize) fontSizeVal.textContent = el.value;
        if (el === strokeWidth) strokeWidthVal.textContent = el.value;
        draw();
      });
    });

    resetBtn.addEventListener('click', () => {
      textInput.value = '오늘의 한 줄';
      if (currentImage) {
        posX.value = Math.round(currentImage.width * 0.08);
        posY.value = Math.round(currentImage.height * 0.08);
      } else {
        posX.value = 50;
        posY.value = 50;
      }
      posXVal.textContent = posX.value;
      posYVal.textContent = posY.value;
      fontSize.value = 48;
      fontSizeVal.textContent = '48';
      textColor.value = '#ffffff';
      strokeColor.value = '#000000';
      strokeWidth.value = 0;
      strokeWidthVal.textContent = '0';
      draw();
    });
  </script>
</body>
</html>
